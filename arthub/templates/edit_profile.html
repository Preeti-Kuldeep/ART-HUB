{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .edit-profile-container {
        max-width: 700px;
        margin: 40px auto;
        padding: 30px;
        border-radius: 12px;
        background-color: #ffffff;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        font-family: 'Poppins', sans-serif;
    }

    .edit-profile-container h2 {
        text-align: center;
        color: #6C63FF;
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    input[type="file"],
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
    }

    .profile-image-preview {
        display: flex;
        justify-content: center;
        margin-bottom: 15px;
    }

    .profile-image-preview img {
        border-radius: 50%;
        width: 130px;
        height: 130px;
        object-fit: cover;
        border: 2px solid #6C63FF;
    }

    .upload-btn {
        display: block;
        width: 100%;
        background-color: #6C63FF;
        color: white;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .upload-btn:hover {
        background-color: #574bd4;
    }
</style>

<div class="edit-profile-container">
    <h2>Edit Your Profile</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        {% if user.profile_image %}
        <div class="profile-image-preview">
            <img src="{{ user.profile_image.url }}" alt="Profile Image" width="150" height="150">
        </div>
        {% else %}
        <img src="{% static 'images/default.png' %}" alt="Default Image">
        {% endif %}

        <div class="form-group">
            <label for="id_profile_image">Change Profile Image:</label>
            {{ form.profile_image }}
        </div>

        <div class="form-group">
            <label for="id_description">About You:</label>
            {{ form.description }}
        </div>

        <button type="submit" class="upload-btn">Save Changes</button>
    </form>
</div>
{% endblock %}
