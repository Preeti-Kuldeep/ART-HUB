<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | ART HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Poppins', sans-serif;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #6C63FF;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        .error-message {
            color: red;
            font-size: 0.9em;
        }

        p {
            margin-top: 15px;
            text-align: center;
        }

        a {
            color: #6C63FF;
            text-decoration: none;
        }
    </style>
</head>
<body>
    
<div class="login-container">
    <h2>Login to ART HUB</h2>

    {% if messages %}
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label for="email">Email</label>
        <input type="email" name="email" id="email" value=""  placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" value="" placeholder="Enter your password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
<style>
    input::placeholder {
    color: #999;  /* Light gray */
    font-style: italic;
    opacity: 1;
}

    </style>

</body>
</html>
